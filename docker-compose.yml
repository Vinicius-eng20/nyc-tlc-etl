# =============================================================================
# NYC TLC ETL Pipeline — Docker Compose
# =============================================================================
# Serviços:
#   - airflow-webserver   : UI do Airflow (porta 8080)
#   - airflow-scheduler   : Agendador de DAGs
#   - airflow-worker      : Executor Celery
#   - airflow-init        : Inicialização do banco e criação do admin
#   - postgres-airflow    : Metadados do Airflow (porta 5432)
#   - postgres-dw         : Data Warehouse (porta 5433)
#   - spark-master        : Spark Master (porta 8081 UI, 7077 cluster)
#   - spark-worker        : Spark Worker (porta 8082 UI)
#   - redis               : Broker Celery (porta 6379)
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__CELERY__BROKER_URL: redis://${REDIS_HOST}:${REDIS_PORT}/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_AIRFLOW_USER}:${POSTGRES_AIRFLOW_PASSWORD}@postgres-airflow:5432/${POSTGRES_AIRFLOW_DB}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Variáveis do DW disponíveis para as DAGs
    POSTGRES_DW_HOST: postgres-dw
    POSTGRES_DW_PORT: ${POSTGRES_DW_PORT}
    POSTGRES_DW_USER: ${POSTGRES_DW_USER}
    POSTGRES_DW_PASSWORD: ${POSTGRES_DW_PASSWORD}
    POSTGRES_DW_DB: ${POSTGRES_DW_DB}
    # Spark
    SPARK_MASTER_URL: ${SPARK_MASTER_URL}
    # Caminhos de dados
    RAW_DATA_PATH: ${RAW_DATA_PATH}
    STAGING_DATA_PATH: ${STAGING_DATA_PATH}
    REJECTED_DATA_PATH: ${REJECTED_DATA_PATH}
    TLC_BASE_URL: ${TLC_BASE_URL}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/plugins:/opt/airflow/plugins
    - ./etl:/opt/airflow/etl
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - tlc-network

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Metadados do Airflow
  # ---------------------------------------------------------------------------
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: ${POSTGRES_AIRFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AIRFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_AIRFLOW_DB}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AIRFLOW_USER} -d ${POSTGRES_AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tlc-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PostgreSQL — Data Warehouse
  # ---------------------------------------------------------------------------
  postgres-dw:
    image: postgres:15-alpine
    container_name: postgres-dw
    environment:
      POSTGRES_USER: ${POSTGRES_DW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DW_DB}
    volumes:
      - postgres-dw-data:/var/lib/postgresql/data
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/create_tables.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DW_USER} -d ${POSTGRES_DW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tlc-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Broker Celery
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tlc-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow — Init (cria tabelas, usuario admin e conexoes)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@nyc-tlc.com \
          --password admin
        airflow connections add 'postgres_dw' \
          --conn-type 'postgres' \
          --conn-host 'postgres-dw' \
          --conn-login '${POSTGRES_DW_USER}' \
          --conn-password '${POSTGRES_DW_PASSWORD}' \
          --conn-schema '${POSTGRES_DW_DB}' \
          --conn-port '5432' || true
        airflow connections add 'spark_default' \
          --conn-type 'spark' \
          --conn-host 'spark://spark-master' \
          --conn-port '7077' || true
        echo "Airflow initialized successfully"
    restart: "no"

  # ---------------------------------------------------------------------------
  # Airflow — Webserver
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow — Scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Airflow — Worker Celery
  # ---------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    environment:
      DUMB_INIT_SETSID: "0"
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark Master
  # ---------------------------------------------------------------------------
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8081
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY}
    ports:
      - "8081:8081"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark-data
      - ./etl:/opt/spark-etl
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tlc-network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark Worker
  # ---------------------------------------------------------------------------
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_WORKER_MEMORY: ${SPARK_EXECUTOR_MEMORY}
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8082:8082"
    volumes:
      - ./data:/opt/spark-data
      - ./etl:/opt/spark-etl
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - tlc-network
    restart: unless-stopped

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-airflow-data:
  postgres-dw-data:
  airflow-logs:

# =============================================================================
# Networks
# =============================================================================
networks:
  tlc-network:
    driver: bridge
